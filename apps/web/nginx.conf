server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2m;
 location /api/ { proxy_pass http://ae-prod-api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location /property/ { proxy_pass http://ae-prod-api:8000; proxy_set_header Host $host; }
 location /site/ { proxy_pass http://ae-prod-api:8000; proxy_set_header Host $host; }
 location = /robots.txt { proxy_pass http://ae-prod-api:8000; }
 location = /sitemap.xml { proxy_pass http://ae-prod-api:8000; }
 location / { try_files $uri $uri/ /index.html; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
}
