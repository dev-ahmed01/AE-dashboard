name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Exercise directory, auth, enquiry and student journeys
        working-directory: apps/api
        run: python -m pytest -q
      - name: Verify database migrations (fresh install)
        working-directory: apps/api
        run: DATABASE_URL=sqlite:///./migration-ci.db python -m alembic upgrade head
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build
      - name: Test live property-template data adapter
        working-directory: apps/web
        run: node --test tests/template-data.test.mjs
