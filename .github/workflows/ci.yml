name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        working-directory: apps/api
        run: pip install -r requirements.lock.txt
      - name: Audit Python production dependencies
        working-directory: apps/api
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.lock.txt
      - name: Exercise directory, auth, enquiry and student journeys
        working-directory: apps/api
        run: python -m pytest -q
      - name: Verify database migrations (fresh install)
        working-directory: apps/api
        run: DATABASE_URL=sqlite:///./migration-ci.db python -m alembic upgrade head
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit
      - name: Audit production npm packages
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build
      - name: Validate private AE Compose topology for shared VPS ingress
        run: |
          cp .env.example .env
          AE_STAGING_HOST=ae-staging.example.org docker compose --env-file .env \
            -f compose.shared-ingress.yaml config --quiet
          python3 - <<'PY'
          import json
          import os
          import subprocess

          env = dict(os.environ, AE_STAGING_HOST="ae-staging.example.org")
          result = subprocess.check_output(
              ["docker", "compose", "--env-file", ".env",
               "-f", "compose.shared-ingress.yaml", "config", "--format", "json"],
              text=True, env=env,
          )
          stack = json.loads(result)["services"]
          assert set(stack) == {"db", "minio", "api", "web"}
          assert all(not service.get("ports") for service in stack.values())
          for service in ("db", "minio", "api"):
              assert set(stack[service]["networks"]) == {"private"}
          assert set(stack["web"]["networks"]) == {"private", "ingress"}
          env_vars = stack["api"]["environment"]
          assert env_vars["APP_ENVIRONMENT"] == "production"
          assert env_vars["LOCAL_DEMO_MODE"] == "0"
          assert env_vars["SEED_ACCOM_DEMO"] == "0"
          print("AE shared-host topology verified: no exposed ports or demo login.")
          PY
      - name: Test live property-template data adapter
        working-directory: apps/web
        run: node --test tests/template-data.test.mjs

  docker-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the same API image used by Docker Compose
        run: docker build --file apps/api/Dockerfile --tag accom-api-smoke .
      - name: Verify the final image contains all runtime modules
        run: docker run --rm --entrypoint python accom-api-smoke -c "import app, editor_preview, property_runtime, demo_seed; print('API imports OK')"
      - name: Start API image and verify its HTTP health check
        env:
          DATABASE_URL: sqlite:////tmp/accom-smoke.db
          JWT_SECRET: github-ci-smoke-only-secret-with-more-than-32-characters
          ADMIN_EMAIL: smoke-admin@example.test
          ADMIN_PASSWORD: github-ci-smoke-only-password-123
          APP_ENVIRONMENT: testing
        run: |
          docker run -d --name accom-api-smoke \
            -p 127.0.0.1:18080:8000 \
            -e DATABASE_URL -e JWT_SECRET -e ADMIN_EMAIL -e ADMIN_PASSWORD -e APP_ENVIRONMENT \
            accom-api-smoke
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              echo "API image is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs accom-api-smoke
          exit 1
      - name: Print container logs and clean up
        if: always()
        run: |
          docker logs accom-api-smoke || true
          docker rm -f accom-api-smoke || true
