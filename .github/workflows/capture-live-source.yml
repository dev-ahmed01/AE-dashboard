name: Capture approved live Accom source
on:
  push:
    branches: [feature/faithful-accom-source-login-first-20261107]
    paths:
      - apps/web/qa/capture-live-source.mjs
      - .github/workflows/capture-live-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/faithful-accom-source-login-first-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download exact deployed HTML and same-origin assets
        run: node apps/web/qa/capture-live-source.mjs
      - name: Report source manifest
        run: cat apps/web/public/accom-live/source-manifest.json | head -35
      - name: Commit captured site to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/accom-live
          if ! git diff --cached --quiet; then
            git commit -m "Vendor exact approved Netlify deployment into Accom dashboard"
            git push origin HEAD:feature/faithful-accom-source-login-first-20261107
          fi
