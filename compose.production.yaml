# AE production stack on shared Contabo, with private student data and media.
# No demo accounts, SQLite or automatic database migrations.
name: accom-emlen-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: accom
      POSTGRES_USER: accom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private DB secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accom -d accom"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set private storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set private storage secret}
    volumes:
      - media:/data
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://accom:${POSTGRES_PASSWORD}@db:5432/accom
      JWT_SECRET: ${JWT_SECRET:?Set private JWT secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set real admin email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set private first-admin password}
      ADMIN_USERNAME: ""
      CORS_ORIGIN: https://${AE_HOST:?Set dashboard HTTPS hostname}
      PUBLIC_SITE_URL: https://${AE_HOST:?Set dashboard HTTPS hostname}
      LOCAL_DEMO_MODE: "0"
      SEED_ACCOM_DEMO: "0"
      ALLOW_BOOTSTRAP_SCHEMA: "0"
      DEMO_ADMIN_USERNAME: ""
      DEMO_ADMIN_PASSWORD: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: accom-assets
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    networks:
      private: {}
      ingress:
        aliases: [ae-prod-web]

networks:
  private:
    internal: true
  ingress:
    external: true
    name: emlen_ingress

volumes:
  pgdata:
  media:
